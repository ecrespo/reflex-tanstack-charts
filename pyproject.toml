[project]
name = "reflex-tanstack-charts"
version = "0.1.0"
description = "Reflex custom component wrapping TanStack Charts (typed, tree-shakable SVG chart grammar)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
requires-python = ">=3.12"
keywords = ["reflex", "reflex-custom-components", "tanstack", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["reflex>=0.8"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-tanstack-charts"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/reflex_tanstack_charts"]

[tool.hatch.build.targets.sdist]
include = ["custom_components", "tests", "specs", "README.md", "LICENSE"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP017 (datetime.UTC) ignored: the tests must also be able to run on <3.11
# interpreters in restricted CI environments; timezone.utc is equivalent.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
