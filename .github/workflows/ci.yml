name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run every JavaScript action on Node 24, even if one still declares node20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check custom_components tests tanstack_charts_demo
      - run: uv run ruff format --check custom_components tests tanstack_charts_demo

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Check version consistency
        run: |
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(sed -nE 's/^__version__ = "(.*)"/\1/p' custom_components/reflex_tanstack_charts/__init__.py)
          echo "pyproject=$PYPROJECT __init__=$INIT"
          test "$PYPROJECT" = "$INIT"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import reflex_tanstack_charts as m; print(m.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  demo:
    name: Demo app production build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: reflex export (frontend)
        working-directory: tanstack_charts_demo
        run: uv run reflex export --frontend-only --no-zip
